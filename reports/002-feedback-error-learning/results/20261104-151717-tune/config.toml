# Tuning feedback-error learning: RLS's forgetting factor by its initial
# regularization, 100 reaches each, from zero weights. Deterministic: there is no
# noise, so one training per setting.

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedforward learns to relieve.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

# rclib's RLS readout, from the reference [q_ref, dq_ref, ddq_ref] and a bias to the
# feedforward torque; every control period it fits its output plus the weak PD's torque.
[readout]
forgetting = 0.999  # the sweep replaces it
delta = 10.0  # the covariance starts at the identity over delta; the sweep replaces it

[training]
trials = 100
dead_zone = 0.0  # m
evaluate_every = 1

[sweep]
"readout.forgetting" = [1.0, 0.9999, 0.999, 0.99]
"readout.delta" = [0.1, 1.0, 10.0, 100.0]
