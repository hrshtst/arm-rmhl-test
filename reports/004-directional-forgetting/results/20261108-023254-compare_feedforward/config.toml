# The feedforward alone: report 002's setting, 0.9999 with a delta of 10, continued
# to 10,000 trials forgetting exponentially, where it winds up (report 003), and
# directionally, and the concurrent schedule's tuned settings forgetting
# directionally, each one training, against PDs of feedback_from_scratch's grid.

[[arm]]
run = "results/combined_learning/20261105-215525-final_feedforward_alone"
label = "0.9999 exponentially, delta 10 (report 003)"

[[arm]]
run = "results/directional_forgetting/20261107-201945-continued_feedforward_alone"
label = "0.9999 directionally, delta 10"

[[arm]]
run = "results/directional_forgetting/20261107-224229-final_feedforward_alone_inertia"
label = "0.999 directionally, delta 10"

[[arm]]
run = "results/directional_forgetting/20261107-221827-final_feedforward_alone_raw"
label = "0.999 directionally, delta 100"

[pd]
run = "results/feedback_from_scratch/20261103-210822-pd_grid"
marks = [[20.0, 0.7], [28.0, 0.7], [40.0, 0.4]]  # rad/s and damping ratio

[plot]
trials = "log"  # the feedforward converges in tens of trials; forgetting exponentially, it winds up after 1,000
