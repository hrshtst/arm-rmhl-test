# The final runs for inertia-scaled feedback: both schedules of the combination
# and its ablations, each learner alone at the concurrent schedule's setting,
# against the decorrelated rule tuned alone for 10,000 trials in
# feedback_from_scratch (report 001), and PDs of its grid.

[[arm]]
run = "results/combined_learning/20261105-215525-final_staged_inertia"
label = "combined, staged"

[[arm]]
run = "results/combined_learning/20261106-134705-final_concurrent_inertia"
label = "combined, concurrent"

[[arm]]
run = "results/combined_learning/20261106-134705-final_feedback_alone_inertia"
label = "feedback alone, concurrent setting"

[[arm]]
run = "results/combined_learning/20261106-134705-final_feedforward_alone_inertia"
label = "feedforward alone, concurrent setting"

[[arm]]
run = "results/feedback_from_scratch/20261104-002706-long_decorrelated_inertia"
label = "RMHL tuned alone (report 001)"

[pd]
run = "results/feedback_from_scratch/20261103-210822-pd_grid"
marks = [[20.0, 0.7], [28.0, 0.7], [40.0, 0.4]]  # rad/s and damping ratio

[plot]
trials = "log"  # the feedforward converges in tens of trials, the feedback in thousands
