# Tuning round 5 for inertia-scaled feedback, concurrent schedule: below a forgetting
# factor of 1, the feedforward winds up and runs away after about 1,400 reaches (see
# README.md), so the concurrent schedule's feedforward does not forget. Its best setting
# without forgetting, a delta of 10 (the feedforward's round), and the feedback's
# settings again around their best there, a learning rate of 160 with 2.5 rad/s^2.
# The grid repeats that setting, which must come out the same as in that round.

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedforward and the feedback add to.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

# The feedforward: feedback-error learning with an RLS readout.
[readout]
forgetting = 1.0  # none: below 1, the covariance winds up
delta = 10.0  # the covariance starts at the identity over delta

[feedback]
scale = "inertia"  # each joint's output times its inertia: the output is in rad/s^2

# burms2015: Gaussian exploration on the output, one update per trial from the
# reward's difference from the mean of the last 50 rewards.
[rule]
preset = "burms2015"
learning_rate = 160.0  # the sweep replaces it
decorrelation = 1.0  # as burms2015 sets it

[rule.exploration]
distribution = "gaussian"
amplitude = 2.5  # rad/s^2, times each joint's inertia; the sweep replaces it
seed = 0  # the tuning's seed; the final runs use 1 to 5

# Concurrent: both learn from every reach. Staged: the feedforward learns from the
# first 100 reaches, as many as report 002's tuning, then the feedback from the rest.
[schedule]
kind = "concurrent"
handover = 100  # reaches; for the staged schedule only

[training]
trials = 1000  # report 001's tuning budget
dead_zone = 0.0  # m
evaluate_every = 20
evaluate_all_until = 100  # every reach of the feedforward's fast start

[sweep]
"rule.learning_rate" = [50.0, 160.0, 500.0]
"rule.exploration.amplitude" = [0.8, 2.5, 8.0]  # rad/s^2
