# Tuning inertia-scaled feedback alone for speed: report 001's decorrelated rule on seed 0,
# scored at 300 trials instead of 1,000, around its tuned setting and toward larger
# learning rates and amplitudes. Everything else is report 001's, its constant included.

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedback learned adds to.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

[feedback]
scale = "inertia"  # each joint's output times its inertia: the output is in rad/s^2

# burms2015: Gaussian exploration on the output, one update per trial from the
# reward's difference from the mean of the last 50 rewards.
[rule]
preset = "burms2015"
learning_rate = 50.0
decorrelation = 1.0  # as burms2015 sets it

[rule.exploration]
distribution = "gaussian"
amplitude = 8.0  # rad/s^2, times each joint's inertia in the torque
seed = 0  # the tuning's seed; the final runs use 1 to 5

[training]
trials = 300
dead_zone = 0.0  # m
evaluate_every = 20
evaluate_all_until = 100

[sweep]
"rule.learning_rate" = [25.0, 50.0, 100.0, 200.0, 400.0, 800.0]
"rule.exploration.amplitude" = [4.0, 8.0, 16.0, 32.0]
