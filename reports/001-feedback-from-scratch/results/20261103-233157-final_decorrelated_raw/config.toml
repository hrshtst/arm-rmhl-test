# The final runs of the decorrelated rule with raw torque,
# on seeds 1 to 5, which the tuning never saw.
# Its tuned setting, the closest at 1,000 trials on seed 0 (tune_decorrelated_round3.toml: 18.0 mm).

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedback learned adds to.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

[feedback]
scale = "none"  # the readout's output is the torque

# burms2015: Gaussian exploration on the output, one update per trial from the
# reward's difference from the mean of the last 50 rewards.
[rule]
preset = "burms2015"
learning_rate = 2.5
decorrelation = 1.0  # as burms2015 sets it

[rule.exploration]
distribution = "gaussian"
amplitude = 3.2  # N m
seed = 1  # the sweep replaces it

[training]
trials = 3000  # the error at 1,000 trials, the tuning's budget, is among the evaluations
dead_zone = 0.0  # m
evaluate_every = 20

[sweep]
"rule.exploration.seed" = [1, 2, 3, 4, 5]
