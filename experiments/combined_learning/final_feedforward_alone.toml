# Ablation: the feedforward alone, at the concurrent inertia-scaled schedule's tuned
# setting (final_concurrent_inertia.toml) without its feedback: report 002's
# setting, for 10,000 trials. There is no noise, so one training.

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedforward and the feedback add to.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

# The feedforward: feedback-error learning with an RLS readout.
[readout]
forgetting = 0.9999
delta = 10.0  # the covariance starts at the identity over delta

# Concurrent: both learn from every reach. Staged: the feedforward learns from the
# first 100 reaches, as many as report 002's tuning, then the feedback from the rest.
[schedule]
kind = "concurrent"
handover = 100  # reaches; for the staged schedule only

[training]
trials = 10000  # the tuning's 1,000 are among the evaluations
dead_zone = 0.0  # m
evaluate_every = 20
evaluate_all_until = 100  # every reach of the feedforward's fast start
