# Tuning, round 3: the plain rule with raw torque, on seed 0. Round 2 improved most at its
# largest amplitude, and ran away where the learning rate times the amplitude reached 0.4;
# this round goes larger still, mostly below that line.
# The seeds of the final runs, 1 to 5, are kept out of the tuning.

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedback learned adds to.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

[feedback]
scale = "none"  # the readout's output is the torque

# burms2015: Gaussian exploration on the output, one update per trial from the
# reward's difference from the mean of the last 50 rewards.
[rule]
preset = "burms2015"
learning_rate = 0.25
decorrelation = false  # burms2015 without its decorrelation: the plain node-perturbation rule

[rule.exploration]
distribution = "gaussian"
amplitude = 0.8  # N m
seed = 0

[training]
trials = 1000
dead_zone = 0.0  # m
evaluate_every = 20

[sweep]
"rule.exploration.amplitude" = [0.8, 1.6, 3.2]
"rule.learning_rate" = [0.03, 0.06, 0.12, 0.25]
