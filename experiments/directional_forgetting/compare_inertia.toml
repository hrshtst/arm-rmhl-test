# The final runs for inertia-scaled feedback, concurrent schedule: the combination
# forgetting directionally, against combined_learning's without forgetting and its
# superseded one forgetting exponentially at report 002's setting (report 003), and
# the feedforward alone at each setting, against PDs of feedback_from_scratch's grid.

[[arm]]
run = "results/directional_forgetting/20261107-224228-final_concurrent_inertia"
label = "combined, 0.999 directionally"

[[arm]]
run = "results/combined_learning/20261106-134705-final_concurrent_inertia"
label = "combined, no forgetting (report 003)"

[[arm]]
run = "results/combined_learning/20261105-215525-final_concurrent_inertia"
label = "combined, 0.9999 exponentially (report 003)"

[[arm]]
run = "results/directional_forgetting/20261107-224229-final_feedforward_alone_inertia"
label = "feedforward alone, 0.999 directionally"

[[arm]]
run = "results/combined_learning/20261106-134705-final_feedforward_alone_inertia"
label = "feedforward alone, no forgetting (report 003)"

[pd]
run = "results/feedback_from_scratch/20261103-210822-pd_grid"
marks = [[20.0, 0.7], [28.0, 0.7], [40.0, 0.4]]  # rad/s and damping ratio

[plot]
trials = "log"  # the feedforward converges in tens of trials, the feedback in thousands
