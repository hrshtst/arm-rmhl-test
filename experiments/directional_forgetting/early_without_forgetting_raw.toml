# Added after the final runs, not in the protocol: the final runs for raw torque
# (final_concurrent_raw.toml) without forgetting, a forgetting factor of 1 with
# the same delta of 100, for their first 100 trials. Three final runs ran away
# from trials 2 and 3, the feedback's weights growing before the feedforward's: do
# they without forgetting?

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedforward and the feedback add to.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

# The feedforward: feedback-error learning with an RLS readout.
[readout]
forgetting = 1.0  # none, where the final runs forget at 0.999
delta = 100.0  # the covariance starts at the identity over delta
forgetting_method = "directional"  # forget only along each period's input

[feedback]
scale = "none"  # the readout's output is the torque

# burms2015: Gaussian exploration on the output, one update per trial from the
# reward's difference from the mean of the last 50 rewards.
[rule]
preset = "burms2015"
learning_rate = 250.0
decorrelation = 1.0  # as burms2015 sets it

[rule.exploration]
distribution = "gaussian"
amplitude = 0.32  # N m
seed = 1  # the sweep replaces it

# Concurrent: both learn from every reach. Staged: the feedforward learns from the
# first 100 reaches, as many as report 002's tuning, then the feedback from the rest.
[schedule]
kind = "concurrent"
handover = 100  # reaches; for the staged schedule only

[training]
trials = 100  # the final runs' early run-aways come within 10
dead_zone = 0.0  # m
evaluate_every = 20
evaluate_all_until = 100  # every reach of the feedforward's fast start

[sweep]
"rule.exploration.seed" = [1, 2, 3, 4, 5]
