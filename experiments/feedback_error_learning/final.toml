# The final run of feedback-error learning, 1,000 reaches from zero weights.
# Its tuned setting, the lowest error at 100 reaches (tune.toml: 3.8 mm).

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedforward learns to relieve.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

# rclib's RLS readout, from the reference [q_ref, dq_ref, ddq_ref] and a bias to the
# feedforward torque; every control period it fits its output plus the weak PD's torque.
[readout]
forgetting = 0.9999
delta = 10.0  # the covariance starts at the identity over delta

[training]
trials = 1000  # the error at 100 trials, the tuning's budget, is among the evaluations
dead_zone = 0.0  # m
evaluate_every = 1
