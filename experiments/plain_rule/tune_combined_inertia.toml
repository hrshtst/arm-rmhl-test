# Tuning, round 1 of arm A, inertia-scaled: report 005's combined controller with the plain
# rule, on seed 0, for 1,000 trials. Everything else is feedback_without_constant's final
# run: the feedforward's setting, which is not tuned again, and no constant in the
# feedback. The learning rates span report 001's plain setting, 0.15 with 4 rad/s^2, to
# the decorrelated combined controller's, 50 with 8 rad/s^2.

# arm-esn-ctrl's v2 arm: two links in the horizontal plane, without gravity.
[initial]
q = [30.0, 30.0]  # deg

[skeleton]
base_length = 0.0

[[skeleton.link]]
length = 0.5
mass = 0.5
inertia = 0.0125
com = [0.25, 0.0]
limits = [-180.0, 180.0]

[[skeleton.link]]
length = 0.4
mass = 0.4
inertia = 0.0064
com = [0.2, 0.0]
limits = [-180.0, 180.0]

[simulator]
dt = 0.002
stops = "locked"

# One reach from rest: the hand to (-0.6, 0.4) m by a minimum-jerk move of 1 s, then 1 s of holding.
[reach]
target = [-0.6, 0.4]
move = 1.0
duration = 2.0
control_period = 0.01

# The weak PD that the feedforward and the feedback add to.
[command]
omega = 5.0  # rad/s
damping_ratio = 0.7

# The feedforward: feedback-error learning with an RLS readout.
[readout]
forgetting = 0.999
delta = 10.0  # the covariance starts at the identity over delta
forgetting_method = "directional"  # forget only along each period's input

[feedback]
scale = "inertia"  # each joint's output times its inertia: the output is in rad/s^2
constant = false  # no bias: the feedback has no constant torque

# burms2015: Gaussian exploration on the output, one update per trial from the
# reward's difference from the mean of the last 50 rewards.
[rule]
preset = "burms2015"
learning_rate = 0.15  # report 001's plain setting; the sweep replaces it
decorrelation = false  # burms2015 without its decorrelation: the plain node-perturbation rule

[rule.exploration]
distribution = "gaussian"
amplitude = 4.0  # rad/s^2, times each joint's inertia; the sweep replaces it
seed = 0  # the tuning's seed; the final runs use 1 to 5

# Concurrent: both learn from every reach. Staged: the feedforward learns from the
# first 100 reaches, as many as report 002's tuning, then the feedback from the rest.
[schedule]
kind = "concurrent"
handover = 100  # reaches; for the staged schedule only

[training]
trials = 1000
dead_zone = 0.0  # m
evaluate_every = 20
evaluate_all_until = 100  # every reach of the feedforward's fast start

[sweep]
"rule.learning_rate" = [0.15, 0.5, 1.5, 5.0, 15.0, 50.0]
"rule.exploration.amplitude" = [2.0, 4.0, 8.0, 16.0]
