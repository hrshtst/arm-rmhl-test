# The final runs for raw-torque exploration, the plain rule's against the decorrelated rule's:
# the combined controller, concurrent, with each rule (this experiment's arm A and
# report 005's), the feedforward alone (report 004), and the feedback alone with each
# rule, without the constant (arm B and report 006's) and with it at report 001's
# settings (arm C and report 001's), against PDs of feedback_from_scratch's grid.

[[arm]]
run = "results/plain_rule/20261112-075657-final_combined_raw"
label = "combined, plain"

[[arm]]
run = "results/feedback_without_constant/20261108-074908-final_concurrent_raw"
label = "combined, decorrelated (report 005)"

[[arm]]
run = "results/directional_forgetting/20261107-221827-final_feedforward_alone_raw"
label = "feedforward alone (report 004)"

[[arm]]
run = "results/plain_rule/20261112-075657-final_feedback_no_constant_raw"
label = "feedback alone, plain, no constant"

[[arm]]
run = "results/plain_rule/20261112-075657-long_plain_raw"
label = "feedback alone, plain (report 001)"

[[arm]]
run = "results/learning_speed/20261111-020819-final_feedback_no_constant_raw"
label = "feedback alone, decorrelated, no constant"

[[arm]]
run = "results/feedback_from_scratch/20261104-002706-long_decorrelated_raw"
label = "feedback alone, decorrelated (report 001)"

[pd]
run = "results/feedback_from_scratch/20261103-210822-pd_grid"
marks = [[20.0, 0.7], [28.0, 0.7], [40.0, 0.4]]  # rad/s and damping ratio

[plot]
trials = "log"  # the feedforward converges in tens of trials, the feedback in thousands
